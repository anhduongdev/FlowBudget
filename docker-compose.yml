services:
  mysql:
    image: mysql:8.0
    container_name: expense-management-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: expense_management
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      # Máy đã có container khác chiếm cổng 3306 mặc định (mysql-test) nên map
      # ra cổng 3307 ở host, bên trong container vẫn là 3306.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
